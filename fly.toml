app = "dutchbook"
primary_region = "iad"

# The graceful shutdown drains an in-flight catalog ingest before exiting:
# SHUTDOWN_TIMEOUT_MS (10s) + JOB_DRAIN_TIMEOUT_MS (60s). Fly's default
# kill_timeout is 5s, which would SIGKILL the machine mid-batch on every
# deploy — exactly the corruption risk the reconciliation is built to survive,
# but there is no reason to exercise it on purpose.
kill_signal = "SIGTERM"
kill_timeout = "90s"

[build]

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  CATALOG_INGEST_ENABLED = "true"
  CATALOG_INGEST_INTERVAL_MS = "600000"
  # The live catalog is ~190k markets across ~75k events, and a full crawl runs
  # well past the 20-minute default — the first deploy aborted at exactly that
  # deadline with 734 batches committed. 45 minutes leaves headroom as the
  # catalog grows; the lock means a run overrunning its 10-minute interval just
  # makes the next tick skip.
  CATALOG_INGEST_TIMEOUT_MS = "2700000"

[deploy]
  # Runs on one machine before the new version takes traffic. A non-zero exit
  # aborts the deploy and leaves the previous version serving, which is what
  # should happen when a migration fails.
  release_command = "node dist/db/migrate.js"
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true

  # This service is a scheduler, not a request handler: it must keep running
  # with no HTTP traffic at all. Suspending an idle machine would stop the
  # ten-minute ingest, which is the entire point of the deployment.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    # Long enough to cover the release command and a cold start before the
    # first check counts against the machine.
    grace_period = "30s"

# Scraped by Fly's managed Prometheus over the private network.
[metrics]
  port = 3000
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
